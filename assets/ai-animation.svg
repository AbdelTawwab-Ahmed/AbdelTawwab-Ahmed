<svg width="900" height="80" viewBox="0 0 900 80"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: 'Fira Code', monospace;
      font-size: 32px;
      font-weight: 700;
      fill: #008CA8;
      text-anchor: middle;
      dominant-baseline: middle;
      opacity: 0;
    }

    .line1 {
      animation: fade1 9s ease-in-out infinite;
    }

    .line2 {
      animation: fade2 9s ease-in-out infinite;
    }

    .line3 {
      animation: fade3 9s ease-in-out infinite;
    }

    @keyframes fade1 {
      0%, 5%   { opacity: 0; }
      12%, 27% { opacity: 1; }
      34%, 100% { opacity: 0; }
    }

    @keyframes fade2 {
      0%, 34%   { opacity: 0; }
      41%, 56% { opacity: 1; }
      63%, 100% { opacity: 0; }
    }

    @keyframes fade3 {
      0%, 63%   { opacity: 0; }
      70%, 85% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
  </style>

  <text x="450" y="40" class="text line1">
    AI Engineer
  </text>

  <text x="450" y="40" class="text line2">
    GenAI | LLMs | RAG
  </text>

  <text x="450" y="40" class="text line3">
    Agentic AI | LangChain | LangGraph
  </text>

</svg>
